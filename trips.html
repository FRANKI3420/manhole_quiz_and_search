<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <title>旅サマリー - マンホール図鑑</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --card-bg: #2a2a2a;
            --accent: #4dabff;
            --text: #eee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .nav {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: #444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        h1 {
            font-size: 20px;
            color: var(--accent);
            margin: 0;
        }

        .rule-note {
            font-size: 12px;
            color: #999;
            margin-bottom: 16px;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #333;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box div {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 4px;
        }

        .stat-box b {
            font-size: 22px;
            color: var(--accent);
        }

        .stat-box b small {
            font-size: 12px;
            color: #aaa;
        }

        .visit-list {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .visit-list h2 {
            font-size: 16px;
            color: var(--accent);
            margin: 0 0 10px 0;
        }

        .visit-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 7px 2px;
            border-bottom: 1px solid #3a3a3a;
        }

        .visit-row:last-child {
            border-bottom: none;
        }

        .visit-row {
            cursor: pointer;
        }

        .visit-row.selected {
            background: rgba(77, 171, 255, 0.15);
            border-radius: 6px;
        }

        .visit-pref {
            font-weight: bold;
            font-size: 15px;
        }

        .visit-sub {
            font-size: 11px;
            color: #999;
            margin-left: 8px;
            font-weight: normal;
        }

        .visit-count {
            font-size: 17px;
            font-weight: bold;
            color: var(--accent);
            white-space: nowrap;
        }

        .visit-count small {
            font-size: 11px;
            color: #aaa;
        }

        .trip-min-btn {
            font-size: 12px;
            padding: 5px 12px;
            background: #222;
            color: #aaa;
            border: 1px solid #444;
            border-radius: 20px;
            cursor: pointer;
        }

        .trip-min-btn.active {
            background: #333;
            color: #fff;
            border-color: var(--accent);
        }

        .trip-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .trip-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
        }

        .trip-period {
            font-size: 17px;
            font-weight: bold;
        }

        .trip-count {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent);
        }

        .trip-count small {
            font-size: 12px;
            color: #aaa;
        }

        .trip-meta {
            font-size: 13px;
            color: #bbb;
            margin-top: 4px;
        }

        .pref-chips {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .pref-chip {
            background: #3a3a3a;
            border: 1px solid #555;
            color: #ddd;
            font-size: 12px;
            padding: 2px 9px;
            border-radius: 999px;
        }

        .cal-links {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cal-link {
            color: var(--accent);
            font-size: 13px;
            text-decoration: none;
            border: 1px solid var(--accent);
            padding: 4px 10px;
            border-radius: 999px;
        }

        details {
            margin-top: 10px;
        }

        summary {
            cursor: pointer;
            font-size: 13px;
            color: var(--accent);
        }

        .day-block {
            margin-top: 8px;
        }

        .day-title {
            font-size: 13px;
            font-weight: bold;
            color: #ffc107;
        }

        .day-cards {
            font-size: 13px;
            color: #ddd;
            margin-left: 6px;
        }

        .empty {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 30px 0;
        }
    </style>
</head>

<body>
    <div class="nav">
        <a href="index.html" class="back-btn">← 戻る</a>
        <h1>🧳 旅サマリー</h1>
    </div>

    <div class="rule-note">
        取得日の間隔が2日以内のものを「同じ旅」として自動でまとめています（旅の一覧は下のボタンで表示する枚数を切り替えられます）。訪問回数は旅単位で数えるので、同じ旅で複数日かかっても1回です。購入したカードは日付を記録しないため含まれません。開くたびに手元の記録から自動計算されます。
    </div>

    <div class="stats-summary" id="summaryArea"></div>
    <div id="prefVisits"></div>
    <div style="display: flex; gap: 8px; margin-bottom: 14px; align-items: center; flex-wrap: wrap;">
        <span style="font-size: 12px; color: #888;">旅の表示:</span>
        <button type="button" class="trip-min-btn active" onclick="setTripMin(3, this)">3枚以上</button>
        <button type="button" class="trip-min-btn" onclick="setTripMin(2, this)">2枚以上</button>
        <button type="button" class="trip-min-btn" onclick="setTripMin(1, this)">すべて（1枚〜）</button>
        <span id="prefFilterStatus" style="font-size: 12px; color: var(--accent); font-weight: bold;"></span>
    </div>
    <div id="tripList"></div>

    <script>
        const userStats = JSON.parse(localStorage.getItem('manhole_collection')) || {};
        let masterData = [];
        let allTrips = [];
        let tripByDate = null;
        let currentTripMin = 3;
        let selectedPref = null;

        function getCardStat(card) {
            const fullKey = `${card.city} (${card.id})`;
            return userStats[card.id] || userStats[fullKey] || userStats[card.city] || null;
        }

        function escapeHtml(str) {
            return String(str ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function parseDate(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function fmtDate(date, withYear) {
            const w = ["日", "月", "火", "水", "木", "金", "土"][date.getDay()];
            const base = `${date.getMonth() + 1}/${date.getDate()}(${w})`;
            return withYear ? `${date.getFullYear()}/${base}` : base;
        }

        function togglePrefFilter(pref) {
            selectedPref = (selectedPref === pref) ? null : pref;
            document.querySelectorAll('.visit-row').forEach(r => {
                r.classList.toggle('selected', r.dataset.pref === selectedPref);
            });
            const st = document.getElementById('prefFilterStatus');
            if (st) st.textContent = selectedPref ? `絞り込み中: ${selectedPref}` : '';
            renderTripList();
        }

        function setTripMin(min, btn) {
            currentTripMin = min;
            document.querySelectorAll('.trip-min-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderTripList();
        }

        function renderTripList() {
            if (!tripByDate) return;
            const byDate = tripByDate;
            const trips = allTrips.filter(t => t.count >= currentTripMin && (!selectedPref || t.prefs.includes(selectedPref)));

            const totalTripCards = trips.reduce((sm, t) => sm + t.count, 0);
            const avg = trips.length ? (totalTripCards / trips.length).toFixed(1) : 0;
            const best = trips.reduce((m, t) => (t.count > (m?.count || 0) ? t : m), null);
            document.getElementById('summaryArea').innerHTML = `
                <div class="stat-box"><div>旅の回数</div><b>${trips.length}</b></div>
                <div class="stat-box"><div>旅で取得した枚数</div><b>${totalTripCards}</b></div>
                <div class="stat-box"><div>1旅あたり平均</div><b>${avg}<small> 枚</small></b></div>
                <div class="stat-box"><div>最多の旅</div><b>${best ? best.count : 0}<small> 枚</small></b></div>
            `;

            if (trips.length === 0) {
                document.getElementById('tripList').innerHTML = '<div class="empty">該当する旅はまだありません</div>';
                return;
            }

            document.getElementById('tripList').innerHTML = trips.map(t => {
                const start = parseDate(t.dates[0]);
                const end = parseDate(t.dates[t.dates.length - 1]);
                const period = t.dates.length === 1
                    ? fmtDate(start, true)
                    : `${fmtDate(start, true)} 〜 ${fmtDate(end, false)}`;
                const days = Math.round((end - start) / 86400000) + 1;
                const chips = t.prefs.map(pr => `<span class="pref-chip">${escapeHtml(pr)}</span>`).join('');
                const months = [...new Set(t.dates.map(d => d.slice(0, 7)))];
                const calLinks = months.map(ym => {
                    const [yy, mm] = ym.split('-');
                    return `<a class="cal-link" href="calender.html?target=${ym}">📅 ${yy}年${Number(mm)}月のカレンダーへ</a>`;
                }).join('');
                const detail = t.dates.map(d => {
                    const names = byDate.get(d).map(c => `${escapeHtml(c.city)}（${escapeHtml(c.edition)}）`).join('、');
                    return `<div class="day-block"><span class="day-title">${fmtDate(parseDate(d), false)}</span><div class="day-cards">${names}</div></div>`;
                }).join('');
                return `
                <div class="trip-card">
                    <div class="trip-head">
                        <span class="trip-period">${period}</span>
                        <span class="trip-count">${t.count}<small> 枚</small></span>
                    </div>
                    <div class="trip-meta">${days}日間 ・ ${t.cityCount}自治体</div>
                    <div class="pref-chips">${chips}</div>
                    <div class="cal-links">${calLinks}</div>
                    <details>
                        <summary>取得したカードを見る</summary>
                        ${detail}
                    </details>
                </div>`;
            }).join('');
        }

        fetch('master_data.json')
            .then(r => r.json())
            .then(data => {
                masterData = data;
                renderTrips();
            })
            .catch(e => {
                document.getElementById('tripList').innerHTML = '<div class="empty">データの読み込みに失敗しました</div>';
                console.error(e);
            });

        function renderTrips() {
            // 日付のある取得記録だけを集める（購入は日付なし＝対象外）
            const byDate = new Map();
            masterData.forEach(card => {
                const stat = getCardStat(card);
                if (stat && stat.collected && stat.date && /^\d{4}-\d{2}-\d{2}$/.test(stat.date)) {
                    if (!byDate.has(stat.date)) byDate.set(stat.date, []);
                    byDate.get(stat.date).push(card);
                }
            });

            const dates = [...byDate.keys()].sort();
            if (dates.length === 0) {
                document.getElementById('tripList').innerHTML = '<div class="empty">日付の記録された取得がまだありません</div>';
                return;
            }

            // 間隔2日以内を同じ旅としてクラスタリング
            const clusters = [];
            let current = [dates[0]];
            for (let i = 1; i < dates.length; i++) {
                const gap = (parseDate(dates[i]) - parseDate(dates[i - 1])) / 86400000;
                if (gap <= 2) {
                    current.push(dates[i]);
                } else {
                    clusters.push(current);
                    current = [dates[i]];
                }
            }
            clusters.push(current);

            const trips = clusters
                .map(ds => {
                    const cards = ds.flatMap(d => byDate.get(d).map(card => ({ date: d, card })));
                    const prefs = [...new Set(cards.map(x => x.card.pref))];
                    const cities = new Set(cards.map(x => x.card.city));
                    return { dates: ds, cards, prefs, cityCount: cities.size, count: cards.length };
                })
                .sort((a, b) => (a.dates[0] < b.dates[0] ? 1 : -1));

            // 都道府県別の訪問回数（旅クラスタ単位：同じ旅で複数日でも1回）
            const visitMap = {};
            clusters.forEach(ds => {
                const cardsInCluster = ds.flatMap(d => byDate.get(d));
                const prefsInCluster = [...new Set(cardsInCluster.map(c => c.pref))];
                prefsInCluster.forEach(pref => {
                    if (!visitMap[pref]) visitMap[pref] = { visits: 0, cards: 0, last: "" };
                    visitMap[pref].visits++;
                    const lastInCluster = ds[ds.length - 1];
                    if (lastInCluster > visitMap[pref].last) visitMap[pref].last = lastInCluster;
                });
            });
            Object.values(visitMap).forEach(v => { v.cards = 0; });
            byDate.forEach((cards, d) => {
                cards.forEach(c => { if (visitMap[c.pref]) visitMap[c.pref].cards++; });
            });
            const visitRows = Object.entries(visitMap)
                .filter(([pref]) => pref !== '世界' && pref !== 'その他')
                .sort((a, b) => b[1].visits - a[1].visits || b[1].cards - a[1].cards)
                .map(([pref, v]) => `
                    <div class="visit-row" data-pref="${escapeHtml(pref)}" onclick="togglePrefFilter('${pref}')">
                        <span class="visit-pref">${escapeHtml(pref)}<span class="visit-sub">取得 ${v.cards}枚 ・ 最終 ${v.last.replace(/-/g, '/')}</span></span>
                        <span class="visit-count">${v.visits}<small> 回</small></span>
                    </div>`).join('');
            document.getElementById('prefVisits').innerHTML =
                `<div class="visit-list"><h2>🗾 都道府県別の訪問回数</h2><div style="font-size: 11px; color: #888; margin-bottom: 6px;">県名をタップすると、その県を含む旅だけ表示します（もう一度タップで解除）</div>${visitRows}</div>`;

            allTrips = trips;
            tripByDate = byDate;
            renderTripList();
        }
    </script>
</body>

</html>
