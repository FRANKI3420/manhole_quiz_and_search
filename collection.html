<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マンホール図鑑 - コレクション</title>
    <link rel="stylesheet" href="styles.css">
    <style>
.pref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <header>
        <header>
            <a href="index.html"
                style="color: #ffffff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                <div style="font-weight:bold;">コレクション図鑑</div>
            </a>
        </header>
        <div class="progress-bar-bg">
            <div id="totalProgress"></div>
        </div>
        <div class="progress-bar-bg" style="height: 4px; margin-top: -8px; opacity: 0.8;">
            <div id="dateProgress" style="background: #ffc107; height: 100%; width: 0%; transition: width 0.5s;"></div>
        </div>
        <div class="stats-text"></div>
    </header>

    <div style="margin-top: 15px; display: flex; flex-direction: row; gap: 8px; justify-content: center; width: 100%;">
        <a href="calender.html" style="
        flex: 1;
        padding: 10px 4px;
        background: #333;
        color: #4dabff;
        text-decoration: none;
        font-size: 12px;
        border: 1px solid #4dabff;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
    ">📅 カレンダー</a>

        <a href="stats.html" style="
        flex: 1;
        padding: 10px 4px;
        background: #333;
        color: #4dabff;
        text-decoration: none;
        font-size: 12px;
        border: 1px solid #4dabff;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
    ">📊 統計</a>

        <a href="category.html" style="
        flex: 1;
        padding: 10px 4px;
        background: #333;
        color: #4dabff;
        text-decoration: none;
        font-size: 12px;
        border: 1px solid #4dabff;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
    ">🏠 カード図鑑</a>
    </div>

    <div class="control-panel">
        <div id="prefStatsContainer">
            <div class="stats-title">
                <span>都道府県別 制覇率</span>
                <span style="display: flex; align-items: center; gap: 8px;">
                    <small id="totalProgressText" style="color:#888;"></small>
                    <button type="button" onclick="toggleStatsSection('prefStatsGrid', this)"
                    style="font-size: 11px; padding: 3px 10px; background: #333; color: #4dabff; border: 1px solid #4dabff; border-radius: 20px; cursor: pointer;">開く ▼</button>
                </span>
            </div>
            <div id="prefStatsGrid" class="pref-grid" style="display: none;"></div>
        </div>

        <div id="editionStatsContainer" style="background: #222; border-radius: 12px; padding: 15px; margin-bottom: 20px;">
            <div class="stats-title">
                <span>弾数別 制覇率</span>
                <button type="button" onclick="toggleStatsSection('editionStatsGrid', this)"
                    style="font-size: 11px; padding: 3px 10px; background: #333; color: #4dabff; border: 1px solid #4dabff; border-radius: 20px; cursor: pointer;">開く ▼</button>
            </div>
            <div id="editionStatsGrid" style="display: none;"></div>
        </div>


        <div id="searchSection"
            style="margin: 15px 0; padding: 12px; background: #1a1a1a; border-radius: 10px; border: 1px solid #333;">
            <div style="font-size: 11px; color: #4dabff; margin-bottom: 6px; font-weight: bold;">🔍 市町村名で自由検索</div>
            <div style="position: relative; width: 100%;">
                <input type="text" id="searchInput" placeholder="例：神戸市、流域下水道..." oninput="handleSearchInput()"
                    style="width: 100%; padding: 12px 40px 12px 12px; background: #222; color: white; border: 2px solid #4dabff; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none;">

                <span id="clearSearchBtn" onclick="clearSearch()"
                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); 
                               width: 24px; height: 24px; background: #444; color: #fff; 
                               border-radius: 50%; display: none; align-items: center; 
                               justify-content: center; cursor: pointer; font-size: 14px; font-weight: bold; z-index: 5;">✕</span>
            </div>
            <div style="font-size: 10px; color: #666; margin-top: 5px;">※入力すると下のフィルターはリセットされます</div>
        </div>

        <div style="text-align: center; color: #444; font-size: 12px; margin: 10px 0;">OR</div>

        <div id="filterSection"
            style="margin: 0 0 15px 0; padding: 12px; background: #1a1a1a; border-radius: 10px; border: 1px solid #333;">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div style="font-size: 12px; color: #888; font-weight: bold;">📂 条件で絞り込む</div>

                <label
                    style="font-size: 14px; color: #fff; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 10px; background: rgba(255,255,255,0.1); border-radius: 6px; user-select: none;">
                    <input type="checkbox" id="uncollectedFilter" onchange="handleFilterChange()"
                        style="cursor: pointer; accent-color: #4dabff; width: 18px; height: 18px; margin: 0;">
                    未取得のみ
                </label>
            </div>

            <div class="select-group" id="filterGroup">
                <select id="prefFilter" onchange="handleFilterChange()">
                    <option value="">都道府県を選択</option>
                </select>
                <select id="editionFilter" onchange="handleFilterChange()">
                    <option value="">弾数を選択</option>
                </select>
            </div>
        </div>

        <div id="filterSection"
            style="margin: 0 0 15px 0; padding: 12px; background: #1a1a1a; border-radius: 10px; border: 1px solid #333;">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 12px; color: #888; font-weight: bold;">📂 ピクトグラム・コラボで絞り込む</span>
                    <button type="button" id="collabToggleBtn" onclick="toggleCollabSection()"
                        style="font-size: 11px; padding: 3px 10px; background: #333; color: #4dabff; border: 1px solid #4dabff; border-radius: 20px; cursor: pointer;">開く ▼</button>
                    <span id="collabCurrent" style="font-size: 12px; color: #4dabff; font-weight: bold;"></span>
                </div>

                <label
                    style="font-size: 14px; color: #fff; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 10px; background: rgba(255,255,255,0.1); border-radius: 6px; user-select: none;">
                    <input type="checkbox" id="uncollectedFilter" onchange="handleFilterChange()"
                        style="cursor: pointer; accent-color: #4dabff; width: 18px; height: 18px; margin: 0;">
                    未取得のみ
                </label>
            </div>

            <div id="collabButtons" style="display: none; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;">
                <!-- すべてクリア -->
                <button type="button" class="collab-btn active" onclick="setCollabFilter('', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 20px; cursor: pointer;">
                    すべて
                </button>

                <!-- コラボ -->
                <button type="button" class="collab-btn" onclick="setCollabFilter('ガンダム', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🤖 ガンダム
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('アイドルマスター', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    ⭐ アイドルマスター
                </button>

                <!-- ピクトグラム（32種） -->
                <button type="button" class="collab-btn" onclick="setCollabFilter('花', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🌸 花
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('木', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🌳 木
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('鳥', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🐦 鳥
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('魚', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🐟 魚
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('動物', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🦁 動物
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('昆虫', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🐞 昆虫
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('果物', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🍎 果物
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('野菜', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🥦 野菜
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('名物品', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🍱 名物品
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('観光名所', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🏯 観光名所
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('鉄道', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🚃 鉄道
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('乗物', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🚗 乗物
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('祭', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🏮 祭
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('イベント', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🎪 イベント
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('スポーツ', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    ⚽ スポーツ
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('偉人', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    👤 偉人
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('文学史', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    📖 文学史
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('おとぎ話', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🐉 おとぎ話
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('キャラクター', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    👾 キャラクター
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('広告宣伝', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    📢 広告宣伝
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('富士山', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🗻 富士山
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('お城', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🏰 お城
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('橋梁', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🌉 橋梁
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('歴史的建造物', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🏛️ 歴史的建造物
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('幾何学模様', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🔷 幾何学模様
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('その他', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    ❓ その他
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('海', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🌊 海
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('山', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    ⛰️ 山
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('川', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🏞️ 川
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('湖・沼', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🚣 湖・沼
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('世界遺産', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🌍 世界遺産
                </button>
                <button type="button" class="collab-btn" onclick="setCollabFilter('下水道施設', this)"
                    style="padding: 6px 12px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; border-radius: 20px; cursor: pointer;">
                    🏭 下水道施設
                </button>
            </div>
        </div>


    </div>

    <div id="filterStats"
        style="padding: 10px; background: #222; text-align: center; font-size: 13px; color: #4dabff; border-bottom: 1px solid #333; display: none;">
        表示中: <span id="currentFilteredCount">0</span>枚 （取得済み: <span id="currentCollectedInFilter">0</span>枚）
    </div>
    <div id="selectionModeArea" style="text-align: center; margin: 10px 0; display:none;">
        <button id="selectModeBtn" class="btn-utility" onclick="toggleSelectionMode()"
            style="background: #444; color: white; width: 45%;">選択モード開始</button>
        <button id="executeBulkBtn" class="btn-main" onclick="executeSelectedCollect()"
            style="display:none; background: #28a745; width: 45%; margin:0; padding: 8px;">選択分を登録</button>
    </div>
    <div id="bulkActionArea" style="display:none; margin: 10px 0;">
        <div id="bulkDateArea"
            style="display: none; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; background: #2a2a2a; padding: 8px; border-radius: 8px;">
            <label style="font-size: 12px; color: #4dabff; font-weight: bold;">一括登録日:</label>
            <input type="date" id="bulkDateInput"
                style="padding: 5px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; font-size: 14px;">
        </div>

        <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 10px;">
            <button id="selectAllBtn" class="btn-utility" onclick="selectAllFiltered()"
                style="flex: 1; display: none; background: #444;">
                表示中をすべて選択
            </button>
            <button id="bulkCollectBtn" class="btn-main" style="flex: 2;">
                カードを選択して登録
            </button>
        </div>
    </div>

    </div>

    <div id="collectionList">
        <div class="empty-state">都道府県か弾数を選択してください</div>
    </div>

    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">

            <div
                style="flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span onclick="closeModal()" style="font-size: 28px; color: #888; cursor: pointer;">✕</span>
                <span id="modalTitle" style="font-size: 20px; font-weight: bold; color: #fff;"></span>
                <span style="width: 28px;"></span>
            </div>

            <img id="modalImg" src="" class="modal-img">

            <div style="flex-shrink: 0; text-align: center; margin: 10px 0;">
                <p id="modalSub" style="color: #888; font-size: 13px; margin-bottom: 8px;"></p>
                <button id="customSearchBtn" class="btn-main" onclick="goToSearchPage()"
                    style="width: 70%; background: #444; color: #fff; padding: 8px; font-size: 13px; border-radius: 6px; margin: 0 auto; display: block;">
                    🔍 画像で判定・検索
                </button>
            </div>

            <div
                style="flex-shrink: 0; background: #222; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px;">
                <div id="dateRow" style="display: flex; align-items: center; justify-content: space-between;">
                    <label style="font-size: 11px; color: #4dabff;">取得日</label>
                    <input type="date" id="collectDate" class="date-input" style="width: 60%; margin: 0; padding: 5px;">
                </div>

                <div id="modalDate" style="text-align: right; min-height: 18px;"></div>

                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label style="font-size: 11px; color: #4dabff;">取得方法</label>
                    <select id="collectMethod" onchange="togglePriceField()" style="width: 60%; margin: 0; padding: 5px; background: #333; color: #fff; border: 1px solid #444; border-radius: 4px;">
                        <option value="visit">現地取得</option>
                        <option value="purchase">購入</option>
                    </select>
                </div>

                <div id="priceRow" style="display: none; align-items: center; justify-content: space-between;">
                    <label style="font-size: 11px; color: #ffc107;">購入金額</label>
                    <div style="width: 60%; display: flex; align-items: center; gap: 6px;">
                        <input type="number" id="purchasePrice" min="0" step="1" inputmode="numeric" placeholder="例：1500" style="flex: 1; margin: 0; padding: 5px; background: #333; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box;">
                        <span style="font-size: 12px; color: #aaa;">円</span>
                    </div>
                </div>

                <div style="margin-top:10px;">
                    <label style="font-size:12px; color:#aaa;">思い出メモ（一行）</label>
                    <input type="text" id="memoInput" placeholder="例：家族旅行で立ち寄った！"
                        style="width:100%; padding:8px; background:#333; color:white; border:1px solid #444; border-radius:4px; box-sizing:border-box;">
                </div>

                <button id="getBtn" class="btn-main" onclick="toggleCollect()"
                    style="margin: 0; padding: 12px; font-size: 16px;"></button>

                <div style="display: flex; gap: 8px;">
                    <button id="deleteBtn" onclick="deleteCollect()"
                        style="flex: 1; background: none; color: #ff4d4d; border: 1px solid #ff4d4d44; font-size: 12px; padding: 8px; border-radius: 6px; display: none;">削除</button>
                    <button onclick="closeModal()" class="btn-utility"
                        style="flex: 2; background: #333; color: #ccc; border: 1px solid #444; font-size: 14px; padding: 8px;">一覧に戻る</button>
                </div>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
        <script src="collection-core.js"></script>
</body>
<footer
    style="margin-top: 40px; padding: 30px 15px; border-top: 1px solid #333; text-align: center; background: #1a1a1a;">
    <div style="font-size: 12px; color: #666; margin-bottom: 15px;">データ管理（機種変更時の移行など）</div>
    <div class="backup-row">
        <button class="btn-utility" onclick="exportBackup()">エクスポート</button>
        <button class="btn-utility" onclick="document.getElementById('importFile').click()">インポート</button>
        <input type="file" id="importFile" style="display:none" onchange="importBackup(event)">
    </div>
    <div style="margin-top: 20px;">
        <div style="font-size: 12px; color: #666; margin-bottom: 8px;">☁️ Google Drive 自動バックアップ</div>
